name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -v
      - name: Installs and runs
        run: |
          pip install .
          shoo --version
          shoo scan --sample 0 --why
          shoo rules
