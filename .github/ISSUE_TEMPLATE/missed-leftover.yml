name: Missed leftover / new rule
description: An abandoned process shoo didn't catch
labels: ["rules", "new rule"]
body:
  - type: markdown
    attributes:
      value: |
        **Redact anything private** (tokens, hostnames, personal paths) from command lines.
  - type: textarea
    id: process
    attributes:
      label: The process
      description: Its row from `shoo scan --why`, or `ps -o pid,ppid,etime,rss,args -p <pid>`.
      render: text
    validations:
      required: true
  - type: textarea
    id: origin
    attributes:
      label: Where it came from
      description: Which agent, tool or editor started it, and how you know it was abandoned.
    validations:
      required: true
  - type: textarea
    id: lookalikes
    attributes:
      label: Anything similar that must NOT match?
      description: Legitimate processes with a similar command line, so the rule can stay narrow.
