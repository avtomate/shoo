[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shoo"
dynamic = ["version"]
description = "Clean up the processes your coding agents leave behind: orphaned MCP servers, headless browsers, dev servers and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "avtomate" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["processes", "orphan", "cleanup", "memory", "ai-agents", "mcp", "claude-code", "devtools", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/avtomate/shoo"
Issues = "https://github.com/avtomate/shoo/issues"
Changelog = "https://github.com/avtomate/shoo/blob/main/CHANGELOG.md"

[project.scripts]
shoo = "shoo.cli:main"

[tool.setuptools.dynamic]
version = { attr = "shoo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shoo", "helpers"]
