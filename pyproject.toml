[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoo"
version = "0.1.0"
description = "Find and clean up orphaned agent and dev-tool processes that are quietly eating your RAM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
shoo = "shoo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
